<!doctype html>
<html lang="en">
  <head>
    <script>
      // Gracefully prevent benign Vite dev-server WebSocket reconnection messages/rejections from surfacing
      (function() {
        var origError = console.error;
        console.error = function() {
          var firstArg = arguments[0];
          var msg = typeof firstArg === 'string' ? firstArg : (firstArg && firstArg.message) || '';
          if (
            msg.indexOf('WebSocket') !== -1 ||
            msg.indexOf('closed without opened') !== -1 ||
            msg.indexOf('[vite]') !== -1
          ) {
            return;
          }
          origError.apply(console, arguments);
        };
      })();

      window.addEventListener('unhandledrejection', function (event) {
        var reason = event && event.reason;
        var msg = (reason && (reason.message || String(reason))) || '';
        if (
          msg.indexOf('WebSocket') !== -1 ||
          msg.indexOf('closed without opened') !== -1 ||
          msg.indexOf('[vite]') !== -1
        ) {
          event.preventDefault();
        }
      });
      window.addEventListener('error', function (event) {
        var msg = (event && (event.message || '')) || '';
        if (
          msg.indexOf('WebSocket') !== -1 ||
          msg.indexOf('closed without opened') !== -1 ||
          msg.indexOf('[vite]') !== -1
        ) {
          event.preventDefault();
        }
      });
    </script>
